<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sin conexión – CRM ALBRA</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f1f5f9; /* slate-100 */
      color: #0f172a; /* slate-900 */
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e2e8f0; /* slate-200 */
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      padding: 40px 32px;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 9999px;
      background: #f1f5f9;
      display: grid;
      place-items: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.375rem;
      font-weight: 700;
      color: #0f172a;
    }
    p {
      margin: 0 0 24px;
      font-size: 0.95rem;
      line-height: 1.55;
      color: #475569; /* slate-600 */
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 10px 26px;
      background: #059669; /* emerald-600, acento del CRM */
      color: #ffffff;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #047857; /* emerald-700 */ }
    button:focus-visible { outline: 3px solid rgba(5, 150, 105, 0.35); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="36" height="36" role="img" aria-label="Icono de sin conexión">
        <g fill="#94a3b8">
          <circle cx="9" cy="13" r="4.5" />
          <circle cx="14.5" cy="11.5" r="5.5" />
          <rect x="9" y="13" width="10.5" height="4.5" rx="2.25" />
        </g>
        <!-- Línea de "cortado": primero recorta con el color del fondo, luego traza la diagonal -->
        <line x1="4.5" y1="4.5" x2="19.5" y2="19.5" stroke="#f1f5f9" stroke-width="2.6" stroke-linecap="round" />
        <line x1="4.5" y1="4.5" x2="19.5" y2="19.5" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>CRM ALBRA necesita internet para mostrar tus datos en tiempo real. Revisa tu conexión e intenta de nuevo.</p>
    <button id="retry" type="button">Reintentar</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      location.reload()
    })
  </script>
</body>
</html>
