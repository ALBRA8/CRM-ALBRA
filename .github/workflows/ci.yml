name: CI CRM-ALBRA
on:
  push:
    branches: [main, 'fix/**', 'repair/**']
  pull_request:
    branches: [main, 'fix/**', 'repair/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Secretos CI-only (≥24 chars) para el arranque fail-fast de la batería (P0.4)
      APP_SECRET: ci-only-app-secret-for-tests-000000000000000
      APP_ENCRYPTION_KEY: ci-only-encryption-key-for-tests-00000000000
      INTERNAL_API_SECRET: ci-only-internal-secret-for-tests-000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps
      - name: Escáner de secretos (CP-Sec-01)
        run: npm run security:scan
      - name: Generar cliente Prisma
        run: npm run db:generate
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint con baseline ratchet (errores NUEVOS bloquean, orden 7, sin continue-on-error)
        run: node scripts/lint-baseline.mjs
      - name: Suite de tests
        run: npx vitest run
      - name: Build de producción
        run: npm run build
