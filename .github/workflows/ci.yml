name: CI CRM-ALBRA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Escáner de secretos (CP-Sec-01)
        run: npm run security:scan
      - name: Generar cliente Prisma
        run: npm run db:generate
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint (baseline preexistente — informativo, no bloqueante)
        run: npm run lint
        continue-on-error: true
      - name: Suite de tests
        run: npx vitest run
      - name: Build de producción
        run: npm run build
        env:
          APP_SECRET: ci-only-secret-for-build-0000000000000000
          APP_ENCRYPTION_KEY: ci-only-encryption-key-000000000000000
          INTERNAL_API_SECRET: ci-only-internal-secret-0000000000000000
