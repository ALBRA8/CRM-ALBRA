name: CI CRM-ALBRA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Secretos CI-only (≥24 chars) para el arranque fail-fast de la batería (P0.4)
      APP_SECRET: ci-only-app-secret-for-tests-000000000000000
      APP_ENCRYPTION_KEY: ci-only-encryption-key-for-tests-00000000000
      INTERNAL_API_SECRET: ci-only-internal-secret-for-tests-000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps
      - name: Escáner de secretos (CP-Sec-01, bloqueante)
        run: npm run security:scan
      - name: Escáner de secretos del HISTORIAL (bloqueante para hallazgos nuevos)
        run: npm run security:scan:history
      - name: Generar cliente Prisma
        run: npm run db:generate
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint — baseline de reducción progresiva (BLOQUEA con errores nuevos)
        run: npm run lint:baseline
      - name: Lint completo (informativo: baseline histórico heredado)
        run: npm run lint
        continue-on-error: true
      - name: Suite de tests
        run: npx vitest run
      - name: Auditoría de dependencias (no bloqueante; elevar a bloqueante tras triage)
        run: npm audit --omit=dev || true
      - name: Build de producción
        run: npm run build
